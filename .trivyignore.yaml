# Trivy ignore: accepted-by-design misconfigurations, path-scoped + justified.
misconfigurations:
  - id: AVD-DS-0002
    paths:
      - "src/gateway/Dockerfile"
    statement: >-
      The gateway sidecar runs as root by design: it is the privileged egress
      boundary component that manages iptables (NET_ADMIN) and Squid at runtime
      (ADR-002). The dev containers, which run untrusted agent code, are non-root
      and cap-dropped. Root here is confined to the firewall sidecar, not the
      agent workload.

secrets:
  # Phase 3 credentials test suite: ghp_-prefixed string literals used as input
  # tokens to compute_fingerprint() unit tests (AC-27-P3-03/04). These verify
  # HMAC-SHA256 determinism, salt non-reversibility, and non-cleartext output.
  # Not real GitHub PATs; the values have no privileges and are never committed
  # to any environment. Test files are the correct place to store test inputs.
  # Phase 3 red-team suite (test_redteam_phase3.py): CANARY_TOKEN is a
  # ghp_-shaped dummy submitted as a credential to verify it is never echoed
  # in responses, audit logs, or log streams (containment regression guard).
  # Not a real GitHub PAT; intentionally ghp_-shaped to exercise the detector.
  - id: github-pat
    paths:
      - "tests/admin/test_credentials_primitive.py"
      - "tests/admin/test_credentials_api.py"
      - "tests/admin/test_redteam_phase3.py"
