# src/caches/docker-compose.verdaccio.yml
# Verdaccio npm pull-through cache overlay.
# Item 14: Pull-through caches (ADR-002 D7, Area 9).
#
# TOPOLOGY RATIONALE (the architectural crux, item 14):
#
# The devcontainer must NOT reach registry.npmjs.org directly.
# Verdaccio must reach registry.npmjs.org through the gateway (OI-14-A).
# Both requirements are enforced via source-based ACL in squid.conf:
#
#   - Verdaccio sends upstream requests with HTTPS_PROXY=http://gateway-cache:8080.
#     'gateway-cache' is a DNS alias declared on cache-net in docker-compose.yml.
#     It resolves to the gateway's cache-net IP (172.30.0.x).
#     Verdaccio's TCP connection to the proxy uses its cache-net interface (172.30.0.x),
#     which matches the cache_src ACL (172.30.0.0/24) in squid.conf.
#   - The devcontainer shares the gateway's netns; its traffic to the proxy
#     arrives on 127.0.0.1 (loopback). It does NOT match cache_src.
#   - squid.conf: ssl_bump splice allowed_registry_SNI cache_src  <- allows caches
#     squid.conf: ssl_bump terminate allowed_registry_SNI         <- blocks devcontainer
#
# GP-02 FIX: The 'gateway' alias (agent-net only) resolved to the gateway's agent-net
# IP (172.31.0.x). Traffic using that alias arrived at Squid from 172.31.0.x, which does
# NOT match cache_src (172.30.0.0/24). The ssl_bump terminate rule fired after CONNECT,
# resetting the connection (httpcore.ConnectError). 'gateway-cache' on cache-net fixes this.
#
# Network layout:
#   - agent-net: devcontainer (via gateway netns) + gateway + verdaccio + devpi
#     Devcontainer reaches verdaccio at http://verdaccio:4873.
#   - cache-net (172.30.0.0/24): gateway + verdaccio + devpi
#     Cache containers use this network to reach the gateway proxy.
#     Their HTTPS_PROXY upstream requests come from 172.30.0.x IPs.
#
# CA/MITM: SNI-splice mode means NO CA cert is needed and NO decryption occurs.
# The real registry.npmjs.org cert is presented to Verdaccio. Verdaccio sees the
# real upstream TLS. No MITM issue arises (confirmed in item 14 header requirement).
#
# Named volumes: all cache storage uses named Docker volumes, NOT host bind mounts
# (AC-14 requirement, ADR-004 D1 condition c).
#
# Usage: docker compose -f docker-compose.yml -f src/caches/docker-compose.verdaccio.yml up

services:

  verdaccio:
    # Verdaccio npm pull-through cache.
    # Image pinned by digest for supply-chain integrity (R-j, ADR-006 D4).
    # Digest resolved 2026-06-14: docker pull verdaccio/verdaccio:5 && docker inspect --format='{{index .RepoDigests 0}}'
    # Multi-arch manifest list digest (amd64 + arm64): verified via docker manifest inspect.
    # To re-pin on upgrade: docker pull verdaccio/verdaccio:5 && docker inspect --format='{{index .RepoDigests 0}}' verdaccio/verdaccio:5
    image: verdaccio/verdaccio:5@sha256:9d622d256378c6e7ae09f384774ee2f0f8ac67a66c066db55921a0b7218abc4c
    container_name: agentarca-verdaccio
    networks:
      - agent-net
      - cache-net
    # Mount the Verdaccio config file (read-only; config is managed not agent-writable).
    # Mount the named storage volume (read-write; this is the cache).
    volumes:
      - type: bind
        source: ./src/caches/verdaccio-config.yaml
        target: /verdaccio/conf/config.yaml
        read_only: true
      - type: volume
        source: verdaccio-storage
        target: /verdaccio/storage
    # HTTPS_PROXY: route upstream requests through the gateway.
    # GP-02 FIX: Use gateway-cache (cache-net alias) not gateway (agent-net alias).
    # 'gateway-cache' resolves to the gateway's cache-net IP (172.30.0.x).
    # Verdaccio's CONNECT arrives at Squid from Verdaccio's cache-net interface (172.30.0.x),
    # which matches cache_src ACL and triggers ssl_bump splice for registry SNIs.
    # With SNI-splice, no CA cert is needed. The real registry.npmjs.org cert
    # is presented to Verdaccio directly (splice = transparent TCP tunnel).
    # NO_PROXY: do not proxy requests TO the gateway itself (avoid loops).
    # Also exclude the devcontainer-internal network from proxy.
    environment:
      HTTPS_PROXY: "http://gateway-cache:8080"
      HTTP_PROXY: "http://gateway-cache:8080"
      NO_PROXY: "localhost,127.0.0.1,devpi,verdaccio"
      # Verdaccio config path
      VERDACCIO_APPDIR: /verdaccio
    # Security: drop all caps, no new privileges.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits.
    mem_limit: 512m
    pids_limit: 64
    # Verdaccio listens on 4873 (configured in verdaccio-config.yaml).
    # No published ports: access is internal only via agent-net.
    # The devcontainer reaches it at http://verdaccio:4873.
    expose:
      - "4873"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

networks:
  agent-net:
    external: true
  cache-net:
    external: true

volumes:
  verdaccio-storage:
    driver: local
