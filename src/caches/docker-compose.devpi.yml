# src/caches/docker-compose.devpi.yml
# devpi PyPI mirror/cache overlay.
# Item 14: Pull-through caches (ADR-002 D7, Area 9).
#
# TOPOLOGY RATIONALE:
# Same source-ACL topology as Verdaccio (see docker-compose.verdaccio.yml header).
#
# devpi runs on both agent-net (for devcontainer access at http://devpi:3141)
# and cache-net (so its upstream requests to pypi.org via HTTPS_PROXY come from
# the 172.30.0.x subnet, matching the cache_src ACL in squid.conf).
#
# GP-02 FIX: Uses HTTPS_PROXY=http://gateway-cache:8080 (cache-net alias).
# 'gateway-cache' resolves to the gateway's cache-net IP (172.30.0.x) so the CONNECT
# request arrives at Squid from the devpi cache-net interface, matching cache_src ACL.
# The old 'gateway' alias (agent-net, 172.31.0.x) did NOT match cache_src, causing
# ssl_bump terminate to fire after CONNECT 200 (httpcore.ConnectError / GP-02).
#
# CA/MITM: SNI-splice means NO CA cert is needed. devpi sees the real pypi.org cert.
#
# devpi server setup:
# On first start, devpi-server initializes its storage and creates the default
# 'root' user with empty password, and the 'root/pypi' index which is a mirror
# of pypi.org. The entrypoint script handles initialization.
#
# Pip index URL (for the devcontainer):
#   http://devpi:3141/root/pypi/+simple/
# This is the standard devpi PyPI mirror URL for simple/PEP 503 lookups.

services:

  devpi:
    # devpi PyPI pull-through cache/mirror.
    # No official devpi Docker image exists on Docker Hub.
    # Built from our own Dockerfile.devpi (python:3.11-slim + devpi-server via pip).
    # Supply-chain integrity: pin the python:3.11-slim base image by digest in Dockerfile.devpi.
    build:
      context: .
      dockerfile: Dockerfile.devpi
    container_name: agentarca-devpi
    networks:
      - agent-net
      - cache-net
    # Named volume for devpi storage (NOT a host bind mount).
    volumes:
      - type: volume
        source: devpi-storage
        target: /devpi
    # HTTPS_PROXY: route upstream requests through the gateway (OI-14-A).
    # GP-02 FIX: Use gateway-cache (cache-net alias) not gateway (agent-net alias).
    # 'gateway-cache' resolves to the gateway's cache-net IP (172.30.0.x).
    # devpi's CONNECT arrives at Squid from devpi's cache-net interface (172.30.0.x),
    # which matches cache_src ACL. The old 'gateway' alias pointed to agent-net IP
    # (172.31.0.x), which did NOT match cache_src, causing ssl_bump terminate to fire
    # after the proxy CONNECT 200, resetting the TLS handshake (httpcore.ConnectError).
    # SNI-splice: no CA cert needed, real pypi.org cert is presented to devpi.
    environment:
      HTTPS_PROXY: "http://gateway-cache:8080"
      HTTP_PROXY: "http://gateway-cache:8080"
      NO_PROXY: "localhost,127.0.0.1,devpi,verdaccio"
      # devpi server data directory
      DEVPI_SERVERDIR: /devpi
    # Security: drop all caps, no new privileges.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits.
    mem_limit: 512m
    pids_limit: 64
    # devpi listens on 3141 by default.
    # No published ports: access is internal only via agent-net.
    expose:
      - "3141"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    # devpi-server command:
    # --host 0.0.0.0 : listen on all interfaces inside the container
    # --port 3141    : default port
    # --serverdir /devpi : storage directory (named volume)
    # The 'root/pypi' mirror index is created during devpi initialization.
    # Init is handled by the official devpi image entrypoint.
    command: ["devpi-server", "--host", "0.0.0.0", "--port", "3141", "--serverdir", "/devpi"]

networks:
  agent-net:
    external: true
  cache-net:
    external: true

volumes:
  devpi-storage:
    driver: local
