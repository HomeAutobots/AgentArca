<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentArca Admin - Credentials</title>
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; margin: 2rem; }
    h1 { color: #4fc3f7; }
    nav a { color: #4fc3f7; margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #444; padding: 0.5rem 1rem; text-align: left; }
    th { background: #2a2a2a; color: #b0bec5; }
    .badge-set { background: #1b5e20; color: #a5d6a7; padding: 2px 8px; border-radius: 3px; }
    .badge-unset { background: #424242; color: #9e9e9e; padding: 2px 8px; border-radius: 3px; }
    .fingerprint { font-family: monospace; color: #80cbc4; font-size: 0.9em; }
    .fp-label { font-size: 0.8em; color: #78909c; }
    button { background: #0d47a1; color: #fff; border: none; padding: 4px 12px;
             border-radius: 3px; cursor: pointer; margin-right: 4px; }
    button.danger { background: #b71c1c; }
    button:hover { opacity: 0.85; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                     background: rgba(0,0,0,0.7); z-index: 10; }
    .modal { background: #2a2a2a; border: 1px solid #555; padding: 1.5rem; border-radius: 6px;
             position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); min-width: 360px; }
    .modal h3 { margin-top: 0; color: #4fc3f7; }
    .modal input[type=password] { width: 100%; background: #1a1a1a; color: #e0e0e0;
                                   border: 1px solid #555; padding: 6px; font-family: monospace;
                                   font-size: 1em; box-sizing: border-box; margin: 0.5rem 0; }
    .error { color: #ef9a9a; margin-top: 0.5rem; }
    .warning { color: #ffcc02; background: #2a2000; border: 1px solid #665500;
               padding: 0.5rem 1rem; border-radius: 3px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>AgentArca Admin - Credentials</h1>
  <nav>
    <a href="/index.html">Dashboard</a>
    <a href="/allowlist.html">Allowlist</a>
    <a href="/profiles.html">Profiles</a>
    <a href="/logs.html">Logs</a>
    <a href="/isolation.html">Isolation</a>
  </nav>

  <div class="warning">
    Tokens are write-only. They are never displayed after submission. The fingerprint
    is a stable non-reversible identifier for change detection only.
  </div>

  <table id="creds-table">
    <thead>
      <tr>
        <th>Key</th>
        <th>Status</th>
        <th>
          Fingerprint
          <span class="fp-label"
            title="A stable, non-reversible identifier for the token.
Changes when you set a new token.
Does not reveal the token value.">(what is this?)</span>
        </th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="creds-tbody">
      <tr><td colspan="4">Loading...</td></tr>
    </tbody>
  </table>

  <!-- Set token modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-title">Set token</h3>
      <p id="modal-key-label" style="color:#b0bec5; font-size:0.9em;"></p>
      <label>Token value:<br>
        <input type="password" id="modal-input" autocomplete="off" autocorrect="off"
               spellcheck="false" maxlength="4096" placeholder="Paste token here...">
      </label>
      <div id="modal-error" class="error"></div>
      <div style="margin-top:1rem;">
        <button id="modal-confirm">Confirm</button>
        <button id="modal-cancel" style="background:#333;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/credentials.js"></script>
</body>
</html>
