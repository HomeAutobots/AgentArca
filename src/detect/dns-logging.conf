# src/detect/dns-logging.conf
# DNS query logging configuration for the Copilot detection stack.
# Item 13, ADR-007 D2c (DNS anomalies), SPEC-07 section 2c + AL-07 + section 10-G.
#
# ARCHITECTURE:
#   DNS queries from the dev container go through the Docker bridge DNS resolver
#   (192.168.65.7 on Docker Desktop macOS, the LinuxKit VM's resolver) per the
#   docker-compose.yml gateway dns: setting. The dev container's iptables
#   (via the gateway sidecar) only permits UDP/TCP port 53 to the internal resolver.
#
#   DNS query logging happens at ONE of these levels:
#     (a) The gateway Squid access.log - Squid logs CONNECT requests including
#         the SNI hostname, which is DNS-adjacent (not raw DNS but the resolved name).
#     (b) The Docker DNS resolver - not directly configurable for query logging.
#     (c) The gateway's dnsmasq or unbound instance (if deployed as part of the
#         ADR-002 D5 internal resolver).
#     (d) A custom DNS resolver sidecar with query logging (this config).
#
#   For the item 13 deployment, DNS logging is provided by:
#     - Squid SNI logging (already captured in gateway access.log, item 08).
#     - A simple dnsmasq config with query logging enabled (this file).
#
# DEPLOYMENT (dnsmasq configuration):
#   If the gateway sidecar or a separate DNS-sidecar runs dnsmasq, add:
#     log-queries          (log all DNS queries)
#     log-facility=/proc/1/fd/1  (send to container stdout for log driver capture)
#   Then forward the dnsmasq log to the sink via the rsyslog pipeline.
#
# DEPLOYMENT (unbound configuration):
#   If using unbound as the internal resolver:
#     log-queries: yes
#     log-replies: yes
#     log-tag-queryreply: yes
#     verbosity: 2
#   Then forward unbound's log to the sink.
#
# DEPLOYMENT NOTE:
#   The current gateway sidecar (src/gateway/squid.conf + init-firewall.sh) uses
#   the host Docker DNS resolver, not a custom dnsmasq/unbound. DNS query logging
#   at the resolver level REQUIRES a custom DNS resolver sidecar.
#   The Squid access.log provides SNI-level host visibility (the hostname the agent
#   tried to reach) which is sufficient for AL-07 detection in the current deployment.
#   A dedicated DNS resolver sidecar is a FUTURE ENHANCEMENT (item 14 or post-item 18).
#   This file documents both the dnsmasq and unbound configs for when that sidecar exists.

# ============================================================
# OPTION A: dnsmasq query logging config
# (for a gateway or DNS-sidecar container running dnsmasq)
# ============================================================
# Place in /etc/dnsmasq.conf or /etc/dnsmasq.d/copilot-logging.conf:
#
# # Log all DNS queries and responses.
# log-queries
# # Direct log output to stdout (for Docker log driver capture -> sink).
# log-facility=/proc/1/fd/1
# # Also log DNSSEC validation failures.
# log-async
# # Upstream forwarder: the host DNS (Docker Desktop's LinuxKit VM resolver).
# # Replace with the appropriate upstream for your deployment.
# server=192.168.65.7
# # Only allow queries from the copilot-net Docker bridge (not arbitrary external hosts).
# # bind-interfaces
# # interface=eth0

# ============================================================
# OPTION B: unbound query logging config
# (for a gateway or DNS-sidecar container running unbound)
# ============================================================
# server:
#   log-queries: yes
#   log-replies: yes
#   log-tag-queryreply: yes
#   log-local-actions: yes
#   verbosity: 2
#   # Write log to stdout for Docker log driver capture.
#   use-syslog: no
#   logfile: ""

# ============================================================
# rsyslog integration: forward DNS log lines to the sink
# ============================================================
# Add this to rsyslog-forward.conf to forward DNS query log lines:
# (Uncomment the dnsmasq/unbound tag when the sidecar is deployed.)
#
# if $syslogtag startswith "dnsmasq" or $syslogtag startswith "unbound" then {
#   action(
#     type="omfwd"
#     Target="host.docker.internal"
#     Port="5140"
#     Protocol="tcp"
#     queue.type="LinkedList"
#     queue.filename="dns-fwd-queue"
#     queue.saveOnShutdown="on"
#   )
# }

# ============================================================
# AL-07 alert thresholds (documented here; implemented in alert-rules.dsl)
# ============================================================
# The alert-rules.dsl AL-07 section applies these thresholds to the DNS query log:
#
# HIGH_ENTROPY_THRESHOLD = 3.5 bits/char
#   (Shannon entropy of the hostname excluding the TLD and known-good domain components)
#   Queries with entropy above this threshold are flagged as potential DNS tunneling.
#   Normal hostnames (api.github.com, microsoft.com) score 2.0-3.0.
#   Encoded/tunneled hostnames (b64-encoded data in labels) score 3.5+.
#
# QUERY_VOLUME_SPIKE = 50 queries/minute (rolling 5-minute window)
#   Normal Copilot agent session: 5-15 DNS queries/minute.
#   A spike above 50/minute is anomalous and suggests scanning or tunneling.
#
# NXDOMAIN_SPIKE = 10 NXDOMAIN responses/minute
#   Normal: 0-2 NXDOMAIN/minute.
#   A spike suggests the agent is probing hostnames (enumeration or tunneling setup).
#
# These thresholds are deliberately conservative (low FP) for the initial deployment.
# The calibration period (SPEC-07 section 5 AL-06/AL-07 note) should refine them
# based on observed baseline behavior before declaring them in production.
#
# SQUID SNI LOG AS CURRENT DNS PROXY:
#   Until a dedicated DNS resolver sidecar is deployed, AL-07 is approximated by:
#   - Squid SNI hostnames (from gateway access.log) as the hostname visibility source.
#   - High-entropy CONNECT hostname analysis (applied in alert-rules.dsl).
#   This is a partial implementation of AL-07. Full DNS-level query logging
#   (including NXDOMAIN responses and query-volume spikes) requires the DNS sidecar.
#   Honest gap: NXDOMAIN spike detection and full query-level entropy analysis
#   are NOT available from the Squid SNI log alone. Document this gap.
