# src/detect/audisp-remote.conf
# audisp-remote configuration for forwarding auditd events to the host-side receiver.
# Item 13, ADR-007 D2d, SPEC-07 section 10-J.
#
# DEPLOYMENT:
#   This file is a HOST-SIDE artifact. Place at:
#     /etc/audisp/plugins.d/au-remote.conf   (auditd plugin descriptor)
#     /etc/audisp/audisp-remote.conf          (transport configuration)
#
#   On the Linux host (or LinuxKit VM), audisp-remote reads from the auditd
#   dispatch pipe and forwards records in real time to the remote receiver.
#   REQUIRES-LINUX-HOST: not configurable headless on Docker Desktop macOS.
#
# Plugin descriptor (place at /etc/audisp/plugins.d/au-remote.conf):
#   active = yes
#   direction = out
#   path = /sbin/audisp-remote
#   type = always
#   format = binary
#
# Transport configuration (this file, place at /etc/audisp/audisp-remote.conf):

# Remote host: the host-side rsyslog/syslog receiver.
# For the detect-net Compose deployment: the host running Docker.
# Replace with the actual IP or hostname of the receiver.
remote_server = 127.0.0.1

# Port for the remote auditd listener (auditd-network protocol).
port = 60

# Mode: plaintext or encrypt. For production, use encrypt + configure krb5.
# For local/detect-net deployment, plaintext is acceptable (receiver is on localhost).
# mode = plain
mode = plain

# Queue configuration: disk-assisted local spool.
# Events are spooled to disk if the remote receiver is temporarily unreachable.
# This ensures events are not lost during transient network outages.
queue_file = /var/spool/auditd-remote-queue
num_strings = 50

# Failure mode: spool on network failure; page on queue overflow.
network_failure_action = spool
disk_error_action = syslog
overflow_action = syslog

# Heartbeat: keepalive to detect receiver unavailability.
heartbeat_timeout = 0

# ============================================================
# PRODUCTION NOTES
# ============================================================
# 1. For TLS-encrypted forwarding, set mode=krb5 and configure Kerberos.
#    This requires a Kerberos realm and is out of scope for the detect-net deployment.
# 2. For encrypted spool-on-disk, use GPG-encrypted queue.
# 3. The receiver (remote audit listener) must be running on the host:
#    systemctl enable auditd-remote  (on the receiver host)
#    auditd-remote listens on port 60 by default.
# 4. The receiver must be a different system from the one running the dev container
#    to satisfy SPEC-07 section 3 condition (c) (separation of duties).
# 5. On macOS Docker Desktop, the LinuxKit VM's auditd is not directly configurable.
#    The practical equivalent is host-side process monitoring (e.g. Endpoint Security
#    Framework on macOS) for the container's processes. This is a REQUIRES-LINUX-HOST
#    limitation and is honestly documented as such.
