# src/detect/rsyslog-forward.conf
# rsyslog TLS omfwd configuration for forwarding hook logs and agent debug logs
# to the host-side sink collector.
# Item 13, ADR-007 D3, SPEC-07 section 10-A.
#
# DEPLOYMENT:
#   This file is placed inside the dev container at /etc/rsyslog.d/60-copilot-forward.conf
#   (or included in the main rsyslog.conf). rsyslog must be installed in the container image.
#   Alternatively, use this from the host rsyslog to forward audit records off the host.
#
# Architecture:
#   Hook log (/tmp/copilot-hook/decisions.log) -> rsyslog imfile -> TLS omfwd -> sink
#   Agent debug log (~/.copilot/debug-logs/*.jsonl) -> rsyslog imfile -> TLS omfwd -> sink
#   auditd -> audisp-remote -> (see audisp-remote.conf) OR -> rsyslog via pipe
#
# TLS mutual authentication:
#   Client cert + key: /etc/rsyslog.d/certs/client.crt + client.key
#   CA cert: /etc/rsyslog.d/certs/ca.crt
#   For the local detect-net deployment (localhost-only), TLS is optional but shown
#   here for production hardening. Replace cert paths for your deployment.
#   For headless/test deployment, remove the StreamDriver* lines for plaintext TCP.
#
# Remote host:
#   The sink is the host-side rsyslog or syslog receiver, reached via
#   host.docker.internal (Docker Desktop macOS) or 172.17.0.1 (typical Docker bridge).
#   For the detect-net Compose deployment (immudb + ingest-proxy), use the
#   ingest-proxy HTTP endpoint instead (HOOK_LOG_SINK env var, see hook-forwarder-addition.sh).
#   This rsyslog config is the SUPPLEMENTAL forward for file-based logs (agent debug log)
#   that are not captured by the HTTP hook forwarder.

# ============================================================
# MODULE CONFIGURATION
# ============================================================

# imfile module: reads log lines from files (the hook log and agent debug log).
module(load="imfile")

# omfwd module: forwards over TCP with TLS.
# Built into rsyslog core; no explicit load needed.

# ============================================================
# INPUT: hook log (fallback local path)
# ============================================================
# Tail the local hook log fallback. This captures lines that are written to the
# local fallback path when the external HOOK_LOG_SINK POST fails.
# When HOOK_LOG_SINK is set to the external sink and the POST succeeds, this file
# may be empty or stale; imfile handles that gracefully.
input(
  type="imfile"
  File="/tmp/copilot-hook/decisions.log"
  Tag="copilot-hook"
  Facility="local0"
  Severity="info"
  PersistStateInterval="10"
  ReadMode="0"
  escapeLF="off"
)

# ============================================================
# INPUT: agent debug log (JSONL)
# ============================================================
# The Copilot agent debug log (github.copilot.chat.agentDebugLog.fileLogging.enabled: true).
# Known issue: VS Code may not create the directory despite the setting being true
# (VS Code issue #307890). The startup check (see startup-check.sh) creates the dir.
# The JSONL file path varies by session; use a glob pattern.
# NOTE: rsyslog imfile with wildcards requires rsyslog 8.23+.
input(
  type="imfile"
  File="/home/devuser/.copilot/debug-logs/*.jsonl"
  Tag="copilot-debug"
  Facility="local0"
  Severity="info"
  PersistStateInterval="10"
  ReadMode="0"
  escapeLF="off"
)

# ============================================================
# DISK-ASSISTED QUEUE (SPEC-07 section 3, D3)
# ============================================================
# Bursts MUST NOT drop events. A disk-assisted queue buffers events
# when the remote sink is temporarily unreachable.
main_queue(
  queue.type="LinkedList"
  queue.filename="copilot-log-queue"
  queue.maxFileSize="50m"
  queue.saveOnShutdown="on"
  queue.highWaterMark="1000"
  queue.lowWaterMark="200"
)

# ============================================================
# OUTPUT: TLS omfwd to the host-side sink
# ============================================================
# Forwards all copilot-tagged messages (hook log + debug log) to the
# host-side rsyslog receiver over TLS.
#
# For the detect-net Docker Compose deployment:
#   Replace 'host.docker.internal' with the ingest-proxy container name
#   or the Docker bridge address if forwarding from another container.
#   For plaintext TCP (test/local): remove StreamDriver lines.
#
# PRODUCTION deployment: replace cert paths and target host.

if $syslogtag startswith "copilot-" then {
  action(
    type="omfwd"
    Target="host.docker.internal"
    Port="5140"
    Protocol="tcp"
    # TLS configuration (for production; remove for local plaintext test):
    # StreamDriver="gtls"
    # StreamDriverMode="1"
    # StreamDriverAuthMode="x509/certvalid"
    # StreamDriverPermittedPeers="sink.internal.example.com"
    # For TLS cert paths:
    # global(DefaultNetstreamDriver="gtls")
    # global(DefaultNetstreamDriverCAFile="/etc/rsyslog.d/certs/ca.crt")
    # global(DefaultNetstreamDriverCertFile="/etc/rsyslog.d/certs/client.crt")
    # global(DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/certs/client.key")

    # Queue for this specific action (defense-in-depth against the main queue).
    queue.type="LinkedList"
    queue.filename="copilot-fwd-queue"
    queue.maxFileSize="20m"
    queue.saveOnShutdown="on"
    queue.highWaterMark="500"
    queue.lowWaterMark="50"
    action.resumeRetryCount="-1"
    action.resumeInterval="5"
  )
  # Also write to a local file as a secondary record (defense-in-depth).
  action(
    type="omfile"
    File="/tmp/copilot-rsyslog-local.log"
    fileCreateMode="0600"
    dirCreateMode="0750"
    CreateDirs="on"
  )
}

# ============================================================
# auditd -> rsyslog pipeline (supplemental; audisp-remote is preferred for auditd)
# ============================================================
# If audisp-remote is not available, auditd can be configured to pipe to rsyslog.
# Example (in /etc/audit/auditd.conf): dispatcher = /usr/sbin/audisp-syslog
# Then rsyslog receives audit records via the default syslog facility.
# This section forwards audit records from the syslog facility to the sink.
# Uncomment if audisp-remote is NOT used and auditd pipes to syslog instead.
