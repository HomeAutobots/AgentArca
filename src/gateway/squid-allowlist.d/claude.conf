# src/gateway/squid-allowlist.d/claude.conf
# Claude Code profile allowlist fragment.
# Loaded ONLY when `docker compose --profile claude up` is active.
# DO NOT place these hosts in base.conf. They must not appear in copilot or codex profiles.
#
# STATUS: LOCKED 2026-06-20 (narrow-host, empirical discovery complete)
# Seed source: code.claude.com/docs/en/corporate-proxy (fetched 2026-06-17).
# EMPIRICAL DISCOVERY (2026-06-20): live Claude Code 2.1.89 with a host-minted
# CLAUDE_CODE_OAUTH_TOKEN (Max subscription) was exercised through this gateway
# (golden-path + arithmetic + code-gen + tool-using file-listing workloads, all
# is_error:false). Steady-state inference contacts ONLY api.anthropic.com. The
# claude.ai / platform.claude.com login origins (Section C) were dropped because the
# OAuth token is minted on the host (never logged in from the container). The lock is
# verified by re-running the workloads with Section C removed (still pass) and confirming
# claude.ai is now terminated from the dev container. See plan/validation/Phase8-live-findings.md.
#
# ADR-008 D2 (SPEC-20 section 5): this fragment is loaded ONLY under the claude profile;
# GitHub Copilot hosts and OpenAI hosts are NOT present here.
# Binding requirement: steady-state default is the narrow-host auth path (api.anthropic.com).
# Sections B (optional) and C (login-only) are droppable post-token-mint.
#
# R-b posture statement (ADR-008 D2 / THREAT_REVIEWED 2026-06-17):
# The inclusion of claude.ai and platform.claude.com (Section C) is a per-agent widening
# of R-b (allowlisted-but-writable-destination exfil, HIGH/HIGH, fundamental).
# These are full consumer-web-app origins; the network layer permits them by design
# and cannot sever leg [C] for them.
# This widening is ACCEPTED as a bounded widening conditioned on:
#   (1) preferred auth path being ANTHROPIC_API_KEY or claude setup-token (api.anthropic.com only)
#   (2) Section C being login-only and droppable post-token-mint
#   (3) empirical discovery run confirming steady-state requirements
# See residual-risk-register.md R-b annotation (ADR-008 D2, THREAT_REVIEWED 2026-06-17).
#
# RC-20-1 CI-checkable narrow-host property:
#   The steady-state locked fragment MUST have Section C hosts commented out or absent.
#   CI assertion: grep -E '^[^#].*claude\.ai|^[^#].*platform\.claude\.com'
#     src/gateway/squid-allowlist.d/claude.conf  must return empty on the locked fragment.
#
# FRAGMENT FORMAT NOTE: This file defines only ACL entries (acl allowed_SNI ssl::server_name ...).
# Do NOT add http_access lines here. The http_access allow/deny rules live in squid.conf.
# Multiple 'acl allowed_SNI' lines with the same ACL name are OR'd by Squid (additive).
# The squid.conf ssl_bump splice rule fires when the SNI matches allowed_SNI (from base.conf
# union this fragment).

# =============================================================================
# SECTION A: STEADY-STATE REQUIRED HOSTS
# Required for headless API-key inference and narrow-host token-mint auth.
# These hosts are needed in steady-state operation (post-token-mint).
# Source: code.claude.com/docs/en/corporate-proxy (fetched 2026-06-17)
# =============================================================================

# Claude API inference (primary; also handles claude setup-token -> CLAUDE_CODE_OAUTH_TOKEN flow)
acl allowed_SNI ssl::server_name api.anthropic.com

# =============================================================================
# SECTION B: OPTIONAL - DROPPABLE AFTER EMPIRICAL DISCOVERY
# Drop if empirical discovery confirms steady-state does not need these.
# =============================================================================

# OPTIONAL: Plugin/binary downloads. DROP if Claude Code is pinned via apt/npm at build time
# (ADR-008 D7, signed apt repo or npm @anthropic-ai/claude-code). Carry pending discovery.
# acl allowed_SNI ssl::server_name downloads.claude.ai

# OPTIONAL: Changelog feed / release notes. Drop if not needed in steady-state.
# acl allowed_SNI ssl::server_name raw.githubusercontent.com

# =============================================================================
# SECTION C: LOGIN-ONLY / DROPPABLE (R-b widening, BINDING CONDITION from ADR-008 D2)
# These are full consumer-web-app origins. They are needed ONLY for the interactive
# subscription-OAuth login window (claude.ai Pro/Max, Anthropic Console).
# After the OAuth token is minted and stored in ~/.claude/.credentials.json,
# these hosts are NOT required for steady-state inference (which goes to api.anthropic.com).
# The empirical discovery run MUST confirm whether these are required in steady-state.
# If NOT required in steady-state, remove these entries and annotate the discovery record.
# R-b: allowing a full web-app origin is a materially wider exfil surface than api.anthropic.com.
# Severity: HIGH/HIGH, fundamental, accepted-as-bounded-widening with binding condition above.
# RC-20-1: When locking this fragment, comment out these two lines and re-run CI.
# =============================================================================

# claude.ai subscription authentication (Pro/Max login). LOGIN-ONLY.
# DROPPED / LOCKED 2026-06-20: empirical discovery (narrow-host, host-minted CLAUDE_CODE_OAUTH_TOKEN)
# confirmed steady-state inference uses ONLY api.anthropic.com. Login happens on the host during
# `claude setup-token`, never from the container, so this web-app origin is not needed in-container.
# Re-enable ONLY if switching to in-container interactive subscription login (paste-code flow).
# acl allowed_SNI ssl::server_name claude.ai

# Anthropic Console login (platform.claude.com). LOGIN-ONLY.
# DROPPED / LOCKED 2026-06-20: same rationale as claude.ai above. Not needed in steady-state.
# acl allowed_SNI ssl::server_name platform.claude.com

# =============================================================================
# SECTION D: EXPLICITLY EXCLUDED HOSTS (never add these to this fragment)
# =============================================================================
# bridge.claudeusercontent.com -- Chrome extension WebSocket bridge; not needed in a headless container
# statsig.com / sentry.io / other telemetry -- disabled at config (DISABLE_TELEMETRY=1); DO NOT add
# storage.googleapis.com -- legacy auto-updater path; not needed when auto-update is disabled
# github.com / api.github.com -- belongs to Copilot profile, NOT Claude
# api.openai.com / chatgpt.com -- belongs to Codex profile, NOT Claude
