# src/gateway/squid-allowlist.d/base.conf
# Agent-agnostic allowlist fragment. Loaded by ALL profiles.
# Source: ADR-002 D4/D7 (item 08 Copilot allowlist, non-Copilot entries split here).
# ADR-008 D2 (SPEC-20 section 3): base carries only agent-agnostic hosts.
# Last verified: 2026-06-17 (carries forward from item 08; item 20 must re-verify on pinned build).
#
# DO NOT add any agent-specific inference API, OAuth, or telemetry host here.
# Those belong in the per-agent fragment (copilot.conf / claude.conf / codex.conf).
# A host in base.conf is reachable by ALL three agent profiles simultaneously.
# Any agent-specific host placed here violates the minimize-don't-union discipline
# (ADR-008 D2, Area 2, Area 9 / R-i).

# ============================================================
# NODE.JS INFRASTRUCTURE (non-registry, all-source permitted)
# These hosts are needed for Node.js toolchain downloads (not packages).
# They remain in the base because they are stack-infrastructure, not agent-specific.
# Status: OBSERVED 2026-06-14 (nodejs.org seen in discovery session).
# ============================================================

# Node.js downloads
acl allowed_SNI ssl::server_name nodejs.org

# Additional Node.js package managers (infrastructure, not registry)
acl allowed_SNI ssl::server_name yarnpkg.com
acl allowed_SNI ssl::server_name registry.yarnpkg.com
acl allowed_SNI ssl::server_name npm.pkg.github.com
acl allowed_SNI ssl::server_name get.pnpm.io

# ============================================================
# VS-CODE-SERVER-IN-CONTAINER FALLBACK ONLY (PRUNED from production list)
# Status: DISABLED in the headless default model.
# Security-reviewer decision 2026-06-14 (item-08 final review): PRUNE for the
# headless default. ADR-003 D2: headless / no-VS-Code-server-in-container is
# the recommended default. In the headless model these four hosts are NOT used
# and are extra allowlisted-writable surface (R-b). Re-enable this block ONLY
# if the VS Code Remote server runs inside the container.
# ============================================================

#acl allowed_SNI ssl::server_name marketplace.visualstudio.com
#acl allowed_SNI ssl::server_name update.code.visualstudio.com
#acl allowed_SNI ssl::server_name vscode.blob.core.windows.net
#acl allowed_SNI ssl::server_name .vscode-cdn.net

# ============================================================
# REGISTRY HOSTS - ITEM 14: CACHE-SOURCE-ONLY ACL
# ACL: allowed_registry_SNI (ONLY cache_src may use these: 172.30.0.0/24)
# Source: item 08 / item 14 (moved from allowed_SNI to allowed_registry_SNI 2026-06-14).
# These registry hosts are agent-agnostic (npm/PyPI serve all three agent profiles).
# ============================================================

# npm registry - OBSERVED 2026-06-14
acl allowed_registry_SNI ssl::server_name registry.npmjs.org
acl allowed_registry_SNI ssl::server_name registry.npmjs.com
acl allowed_registry_SNI ssl::server_name npmjs.org
acl allowed_registry_SNI ssl::server_name npmjs.com

# PyPI / pip / pythonhosted - DOCUMENTED (Python stack)
# IMPORTANT: .pythonhosted.org (leading dot) matches ALL subdomains including
# files.pythonhosted.org. Do NOT also list files.pythonhosted.org separately.
acl allowed_registry_SNI ssl::server_name pypi.org
acl allowed_registry_SNI ssl::server_name pypi.python.org
acl allowed_registry_SNI ssl::server_name .pythonhosted.org
acl allowed_registry_SNI ssl::server_name pip.pypa.io
acl allowed_registry_SNI ssl::server_name bootstrap.pypa.io
