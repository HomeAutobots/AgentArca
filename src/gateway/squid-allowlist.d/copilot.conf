# src/gateway/squid-allowlist.d/copilot.conf
# GitHub Copilot CLI profile allowlist fragment.
# Loaded ONLY when `docker compose --profile copilot up` is active.
# DO NOT place these hosts in base.conf. They must not appear in claude or codex profiles.
#
# STATUS: LOCKED 2026-06-14 (empirical discovery complete, Individual plan).
# Source: item 08 / item 14 (split from monolithic squid-allowlist.conf into this fragment).
# ADR-002 D4 (empirical-discovery methodology, ADR-008 D2 minimize-don't-union).
# ADR-008 D2: this fragment is loaded ONLY under the copilot profile;
# api.anthropic.com and api.openai.com are NOT present here.
#
# DISCOVERY SUMMARY (2026-06-14):
#   Method: device-flow gh auth + standalone @github/copilot CLI agent task
#   routed through the splice-all discovery gateway.
#   OBSERVED SNIs in authenticated Copilot CLI discovery session:
#     api.individual.githubcopilot.com  - Copilot agent API (Individual plan)
#     telemetry.individual.githubcopilot.com - Copilot telemetry (Individual plan)
#     github.com                        - GitHub auth
#     api.github.com                    - GitHub API
#     release-assets.githubusercontent.com - GitHub asset downloads
#     registry.npmjs.org                - npm registry (moved to base.conf/allowed_registry_SNI)
#     nodejs.org                        - Node.js downloads (moved to base.conf)
#   DOCUMENTED (GitHub official Copilot allowlist; VS Code Copilot client):
#     copilot-proxy.githubusercontent.com
#     origin-tracker.githubusercontent.com
#     default.exp-tas.com

# ============================================================
# COPILOT / GITHUB BLOCK
# ACL: allowed_SNI (all local sources permitted)
# ============================================================

# GitHub authentication
# Status: OBSERVED 2026-06-14
acl allowed_SNI ssl::server_name github.com

# GitHub API (needed for auth and Copilot internal calls)
# Status: OBSERVED 2026-06-14
acl allowed_SNI ssl::server_name api.github.com

# GitHub asset downloads - release assets
# Status: OBSERVED 2026-06-14 (the REAL asset host; resolves prior objects.githubusercontent.com open item)
acl allowed_SNI ssl::server_name release-assets.githubusercontent.com

# Copilot suggestions API and WebSockets
# Status: DOCUMENTED-not-observed-in-CLI-agent-discovery (GitHub official Copilot allowlist)
acl allowed_SNI ssl::server_name copilot-proxy.githubusercontent.com

# Origin tracker (required per Copilot allowlist reference)
# Status: DOCUMENTED-not-observed-in-CLI-agent-discovery
acl allowed_SNI ssl::server_name origin-tracker.githubusercontent.com

# Copilot API for Individual plan
# Status: OBSERVED 2026-06-14 - NARROWED from .githubcopilot.com to .individual.githubcopilot.com
# NOTE: do NOT also list api.individual.githubcopilot.com or telemetry.individual.githubcopilot.com
# separately - Squid will FATAL on the redundant entries when a leading-dot wildcard is present.
# Widen back to .githubcopilot.com if needed for Business/Enterprise plans.
acl allowed_SNI ssl::server_name .individual.githubcopilot.com

# A/B experiment service (Copilot feature flags)
# Status: DOCUMENTED-not-observed-in-CLI-agent-discovery (GitHub official Copilot allowlist)
acl allowed_SNI ssl::server_name default.exp-tas.com

# ============================================================
# EXPLICITLY BLOCKED / NOT ON ALLOWLIST
# ============================================================
# api.anthropic.com - belongs to Claude profile, NOT Copilot
# api.openai.com    - belongs to Codex profile, NOT Copilot
# claude.ai         - belongs to Claude profile, NOT Copilot
# chatgpt.com       - belongs to Codex profile, NOT Copilot
# copilot-telemetry.githubusercontent.com - REMOVED-superseded 2026-06-14
# collector.github.com - REMOVED-unobserved 2026-06-14
