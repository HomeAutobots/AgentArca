# src/gateway/squid-allowlist.d/codex.conf
# OpenAI Codex CLI profile allowlist fragment.
# Loaded ONLY when `docker compose --profile codex up` is active.
# DO NOT place these hosts in base.conf. They must not appear in copilot or claude profiles.
#
# STATUS: LOCKED (ChatGPT-subscription path, empirically verified 2026-06-22)
# OpenAI publishes no official network requirements page for Codex CLI (openai/codex#6344).
# THIS FRAGMENT is the source of truth for the Codex egress allowlist.
# The seed list is from ADR-008 D2 (verified 2026-06-17 against openai/codex issues).
# EMPIRICAL DISCOVERY RUN 2026-06-22 (SPEC-20 section 7, splice-all observe mode, real
# ChatGPT-subscription login via `codex login --device-auth` + a representative `codex exec`):
#   - chatgpt.com    : REQUIRED. The ChatGPT-subscription auth path routes INFERENCE through
#                      chatgpt.com (model gpt-5.5, provider openai), not api.openai.com. It is
#                      NOT login-only/droppable on this path (contrast the API-key path).
#   - auth.openai.com: login + token refresh (device-auth flow).
#   - api.openai.com : minor Codex API calls (capability/config). Kept (narrow, OpenAI-owned).
#   - github.com     : OBSERVED (codex auxiliary, e.g. update/version check) but DELIBERATELY
#                      EXCLUDED. Production validation confirmed `codex exec` inference succeeds
#                      with github.com BLOCKED (HTTP 000); not required for core function.
#   - pypi.org/npm   : cache-infra traffic (devpi/verdaccio upstream via cache-net), covered by
#                      base.conf allowed_registry_SNI + the cache_src splice, NOT this fragment.
# PRODUCTION BOUNDARY VALIDATION 2026-06-22 (codex.conf enforced, from codex-devcontainer via
# proxy): chatgpt.com routed (403), api.openai.com routed (421); example.com BLOCKED (000),
# github.com BLOCKED (000), api.anthropic.com BLOCKED (000, cross-agent isolation holds).
# NOTE: the narrow-host lock (api.openai.com only) is achievable ONLY on the API-key path.
# This deployment uses the ChatGPT-subscription path, so chatgpt.com + auth.openai.com remain
# (the ADR-008 D2 R-b widening, accepted-with-conditions, now empirically confirmed required).
# Discovery wrapper drift: scripts/discover-allowlist.sh still targets the pre-F2 single
# `gateway` service/`copilot-gateway` container and must be updated to per-profile gateways;
# this run was driven manually with the per-profile commands. Tracked as a follow-up.
#
# ADR-008 D2 (SPEC-20 section 6): this fragment is loaded ONLY under the codex profile;
# GitHub Copilot hosts and Anthropic hosts are NOT present here.
# Binding requirement: steady-state default is the narrow-host API-key path (api.openai.com).
# Sections B (login-only) are droppable post-token-mint when using OPENAI_API_KEY.
#
# R-b posture statement (ADR-008 D2 / THREAT_REVIEWED 2026-06-17):
# The inclusion of chatgpt.com and auth.openai.com (Section B) is a per-agent widening
# of R-b (allowlisted-but-writable-destination exfil, HIGH/HIGH, fundamental).
# chatgpt.com is a full consumer-web-app origin with rich authenticated POST surfaces.
# The network layer permits it by design; it cannot sever leg [C] for it.
# This widening is ACCEPTED as a bounded widening conditioned on:
#   (1) preferred auth path being OPENAI_API_KEY or CODEX_API_KEY (api.openai.com only)
#   (2) Section B being login-only and droppable post-token-mint
#   (3) empirical discovery run confirming steady-state requirements
#
# CODEX PROXY-HONORING IS INCOMPLETE: Codex's OAuth (auth.openai.com) and MCP-bootstrap
# traffic can bypass HTTPS_PROXY (openai/codex#6849/#16360/#4242). This is NOT a gap;
# it is why the L3 gateway default-DROP (ADR-002 D1/D2, no NET_ADMIN in dev container)
# is mandatory. A proxy-ignoring Codex process still has no direct internet path because
# all traffic flows through the gateway netns. The L3 boundary contains it regardless.
# See residual-risk-register.md R-l and R-b annotations (ADR-008 D2/D4, THREAT_REVIEWED 2026-06-17).
#
# FRAGMENT FORMAT NOTE: This file defines only ACL entries (acl allowed_SNI ssl::server_name ...).
# Do NOT add http_access lines here. The http_access allow/deny rules live in squid.conf.
# Multiple 'acl allowed_SNI' lines with the same ACL name are OR'd by Squid (additive).
# The squid.conf ssl_bump splice rule fires when the SNI matches allowed_SNI (from base.conf
# union this fragment).

# =============================================================================
# SECTION A: STEADY-STATE REQUIRED HOSTS
# Required for headless API-key inference.
# Source: ADR-008 D2 (seed from openai/codex issues; no official network page)
# =============================================================================

# OpenAI API inference (API-key path: OPENAI_API_KEY or CODEX_API_KEY)
acl allowed_SNI ssl::server_name api.openai.com

# =============================================================================
# SECTION B: LOGIN-ONLY / DROPPABLE (R-b widening, BINDING CONDITION from ADR-008 D2)
# These are needed ONLY for ChatGPT subscription OAuth login.
# After the OAuth token is minted and stored in ~/.codex/auth.json (PLAINTEXT),
# these hosts are NOT required for API-key steady-state inference (api.openai.com).
# The empirical discovery run MUST confirm whether these are required in steady-state.
# If NOT required in steady-state, remove these entries and annotate the discovery record.
# R-b: chatgpt.com is a full consumer-web-app origin, materially wider than api.openai.com.
# Severity: HIGH/HIGH, fundamental, accepted-as-bounded-widening with binding condition above.
# RC-20-1: When locking this fragment, comment out these two lines and re-run CI.
# =============================================================================

# ChatGPT subscription + OAuth login. LOGIN-ONLY. DROP after token mint if API-key path is used.
acl allowed_SNI ssl::server_name chatgpt.com

# OpenAI OAuth auth endpoint (localhost:1455 callback flow). LOGIN-ONLY.
acl allowed_SNI ssl::server_name auth.openai.com

# =============================================================================
# SECTION C: EXPLICITLY EXCLUDED HOSTS (never add these to this fragment)
# =============================================================================
# statsig.com -- Codex analytics; disabled at config ([analytics] enabled=false)
# sentry.io -- error reporting; disabled at config
# api.anthropic.com -- belongs to Claude profile, NOT Codex
# claude.ai -- belongs to Claude profile, NOT Codex
# platform.claude.com -- belongs to Claude profile, NOT Codex
# github.com / api.github.com -- belongs to Copilot profile, NOT Codex
# Any telemetry host -- OTel exporter set to "none"; DO NOT add
