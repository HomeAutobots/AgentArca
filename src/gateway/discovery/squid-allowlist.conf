# ============================================================
# REGISTRY HOSTS - ITEM 14: CACHE-SOURCE-ONLY ACL
# ACL: allowed_registry_SNI (ONLY cache_src may use these)
#
# ITEM 14 CHANGE: These registry hosts were previously in 'allowed_SNI'
# (reachable from all local sources including the devcontainer).
# They are now in 'allowed_registry_SNI', which squid.conf splices ONLY
# when the request source matches 'cache_src' (172.30.0.0/24 = cache-net).
#
# Effect:
#   - Verdaccio (172.30.0.x): ALLOWED to reach registry.npmjs.org, etc.
#     (upstream fetch via the gateway; OI-14-A satisfied)
#   - devpi (172.30.0.x): ALLOWED to reach pypi.org, files.pythonhosted.org
#     (upstream fetch via the gateway; OI-14-A satisfied)
#   - devcontainer (source = 127.0.0.1, NOT in cache_src):
#     DENIED (ssl_bump terminate); AC-14-P05 / AC-14-N01 satisfied.
#
# Squid.conf handles the splice/terminate differentiation via:
#   ssl_bump splice allowed_registry_SNI cache_src  <- caches only
#   (falls through to ssl_bump terminate all for devcontainer)
# ============================================================

# npm registry - OBSERVED 2026-06-14; MOVED to registry-only ACL (item 14)
acl allowed_registry_SNI ssl::server_name registry.npmjs.org

# Additional npm registry mirrors - DOCUMENTED; MOVED to registry-only ACL (item 14)
acl allowed_registry_SNI ssl::server_name registry.npmjs.com
acl allowed_registry_SNI ssl::server_name npmjs.org
acl allowed_registry_SNI ssl::server_name npmjs.com

# ============================================================
# PYTHON / PIP / PYPI - ITEM 14: CACHE-SOURCE-ONLY ACL
# Status: DOCUMENTED (Python stack); MOVED to registry-only ACL (item 14)
#
# IMPORTANT: .pythonhosted.org (leading dot) matches ALL subdomains
# including files.pythonhosted.org. Do NOT also list files.pythonhosted.org
# separately - Squid will FATAL on the redundant specific-subdomain entry.
# ============================================================

acl allowed_registry_SNI ssl::server_name pypi.org
acl allowed_registry_SNI ssl::server_name pypi.python.org
acl allowed_registry_SNI ssl::server_name .pythonhosted.org
acl allowed_registry_SNI ssl::server_name pip.pypa.io
acl allowed_registry_SNI ssl::server_name bootstrap.pypa.io

