# src/gateway/squid-allowlist.conf
# Deny-by-default allowlist for the gateway sidecar.
# ADR-002 D4: "deny-by-default allowlist, expressed by SNI/Host at L7"
#
# STATUS: UPDATED 2026-06-14 (item 14 - pull-through caches)
#   LOCKED 2026-06-14 (empirical discovery complete, Individual plan)
#
# ITEM 14 CHANGE (2026-06-14):
#   Registry SNIs (registry.npmjs.org, pypi.org, *.pythonhosted.org, etc.) have been
#   MOVED from the general 'allowed_SNI' ACL to a new 'allowed_registry_SNI' ACL.
#
#   Source-ACL policy (enforced in squid.conf, NOT here):
#     - allowed_registry_SNI hosts are spliced ONLY when the request comes from
#       the cache subnet (cache-net, 172.30.0.0/24 = the 'cache_src' ACL in squid.conf).
#     - Requests to registry SNIs from the devcontainer (source 127.0.0.1, which does
#       NOT match cache_src) are TERMINATED (ssl_bump terminate).
#     - This satisfies AC-14-P05/N01: the devcontainer cannot reach registries directly.
#     - The caches (Verdaccio, devpi) DO reach registries via the gateway (OI-14-A).
#
#   SNI-splice CA/MITM note: splice mode passes the REAL registry cert to the cache
#   service. No CA cert is distributed. No MITM occurs on the cache->registry leg.
#   Verdaccio and devpi see the genuine registry.npmjs.org / pypi.org TLS certificate.
#
#   Internal cache hosts:
#     - verdaccio and devpi are on copilot-net (Docker internal DNS resolves them).
#     - The devcontainer reaches them at http://verdaccio:4873 and http://devpi:3141
#       (plain HTTP on the internal network, no proxy needed for internal hops).
#     - These do NOT need allowlist entries because they are plain-HTTP internal
#       Docker network connections (no HTTPS, no proxy, no SNI filtering involved).
#
# SECURITY REVIEWER NOTE (RC-2 condition, item 14 gate):
#   The item-08 invariants are re-verified after this allowlist edit:
#   (5) gateway-selfcheck.sh still passes.
#   (6) iptables -F from devcontainer still returns EPERM.
#   (7) fail-closed: gateway down = no devcontainer network.
#   (8) example.com is still denied by the updated allowlist.
#   Results recorded in plan/STATE.md item 14 row.
#
# DISCOVERY SUMMARY (2026-06-14):
#   Method: device-flow gh auth + standalone @github/copilot CLI agent task
#   routed through the splice-all discovery gateway. Real Copilot agent task
#   observed: read m.js and report the bug.
#
#   OBSERVED (SNIs seen in gateway access.log during authenticated Copilot workflow):
#     api.individual.githubcopilot.com  - Copilot agent API (Individual plan)
#     telemetry.individual.githubcopilot.com - Copilot telemetry (Individual plan)
#     github.com                        - GitHub auth
#     api.github.com                    - GitHub API
#     release-assets.githubusercontent.com - GitHub asset downloads (resolves the
#                                          prior objects.githubusercontent.com open item;
#                                          release-assets is the REAL asset host)
#     registry.npmjs.org                - npm registry
#     nodejs.org                        - Node.js downloads
#
#   DOCUMENTED (GitHub official Copilot allowlist; needed for VS Code Copilot client
#   even though the CLI agent did not hit these in the discovery session):
#     copilot-proxy.githubusercontent.com
#     origin-tracker.githubusercontent.com
#     default.exp-tas.com
#
#   REMOVED (superseded or never observed):
#     copilot-telemetry.githubusercontent.com - REMOVED-superseded: the real Individual
#       plan agent uses telemetry.individual.githubcopilot.com (covered by the
#       .individual.githubcopilot.com wildcard). The old copilot-telemetry.githubusercontent.com
#       host was NOT observed in the authenticated discovery session 2026-06-14.
#     collector.github.com - REMOVED-unobserved: carried as CARRIED-PENDING seed from
#       ADR-002 D4. Never observed in the authenticated Copilot discovery session 2026-06-14.
#       Not present in the current authoritative GitHub Copilot allowlist reference.
#
#   NOT OBSERVED in CLI agent discovery (gh CLI only, not production):
#     cafe.github.com - seen from gh CLI only; NOT the Copilot agent. Excluded.
#
#   BUILD-TIME ONLY (not production, excluded):
#     archive.ubuntu.com, security.ubuntu.com - apt noise during container build only.
#
# IMPORTANT: This file defines TWO ACLs used by squid.conf:
#   1. 'allowed_SNI'          - hosts reachable from ALL local sources (devcontainer + caches)
#   2. 'allowed_registry_SNI' - registry hosts reachable ONLY from cache_src (172.30.0.0/24)
#
# ACL type: ssl::server_name
#   This matches the PEEKED TLS SNI from the ClientHello, NOT the
#   client-supplied CONNECT host. This is the key security property:
#   even if a client sends CONNECT allowlisted-host:443 but then
#   presents SNI for a non-allowlisted host in the TLS handshake
#   (domain-fronting / SNI-mismatch bypass), Squid observes the real
#   SNI and ssl_bump terminate blocks it.
#
# ssl::server_name matching:
#   .example.com  -> matches all subdomains AND the apex (example.com)
#   example.com   -> matches only the exact hostname (no subdomains)
#
# Squid rule: if .example.com is listed, do NOT also list any specific
# subdomain of example.com - Squid will FATAL on the redundant entry.
# Use the wildcard OR specific subdomains, not both.
#
# CRITICAL: Since .individual.githubcopilot.com is a leading-dot wildcard,
# do NOT also list api.individual.githubcopilot.com or
# telemetry.individual.githubcopilot.com separately. Squid will FATAL on
# the redundant specific-subdomain entries. The wildcard covers both.
#
# Verified: Squid 5.9 ssl::server_name with peek+splice, no CA cert needed.
# Parse-tested 2026-06-14 (exit 0 with http_port ssl-bump, no cert= param).

# ============================================================
# COPILOT / GITHUB BLOCK
# ACL: allowed_SNI (all local sources permitted)
# ============================================================

# GitHub authentication
# Status: OBSERVED 2026-06-14 (seen in authenticated Copilot CLI discovery session)
acl allowed_SNI ssl::server_name github.com

# GitHub API (needed for auth and Copilot internal calls)
# Status: OBSERVED 2026-06-14 (seen in authenticated Copilot CLI discovery session)
acl allowed_SNI ssl::server_name api.github.com

# GitHub asset downloads - release assets
# Status: OBSERVED 2026-06-14 (this is the REAL asset host; resolves the prior
# objects.githubusercontent.com open item. release-assets.githubusercontent.com
# is what the current GitHub CLI/Copilot uses for asset downloads.)
acl allowed_SNI ssl::server_name release-assets.githubusercontent.com

# Copilot suggestions API and WebSockets
# Status: DOCUMENTED-not-observed-in-CLI-agent-discovery (GitHub official Copilot
# allowlist; the VS Code Copilot client needs this even though the standalone
# Copilot CLI agent did not hit it in the 2026-06-14 discovery session)
# Reference: https://docs.github.com/en/copilot/reference/copilot-allowlist-reference
acl allowed_SNI ssl::server_name copilot-proxy.githubusercontent.com

# Origin tracker (required per Copilot allowlist reference)
# Status: DOCUMENTED-not-observed-in-CLI-agent-discovery (GitHub official Copilot
# allowlist; the VS Code Copilot client needs this even though the standalone
# Copilot CLI agent did not hit it in the 2026-06-14 discovery session)
# Reference: https://docs.github.com/en/copilot/reference/copilot-allowlist-reference
acl allowed_SNI ssl::server_name origin-tracker.githubusercontent.com

# Copilot API for Individual plan (observed subdomain pair: api.individual + telemetry.individual)
# Status: OBSERVED 2026-06-14 - NARROWED from .githubcopilot.com to .individual.githubcopilot.com
# Discovery observed: api.individual.githubcopilot.com (Copilot agent API)
#                     telemetry.individual.githubcopilot.com (Copilot telemetry)
# Rationale for narrowing: Only these two subdomains were observed on the Individual plan.
# The broader .githubcopilot.com wildcard (which also covers api.githubcopilot.com used
# by Team/Enterprise) is NOT needed for Individual plan. Narrowed to .individual to reduce
# attack surface. If Copilot breaks (a needed SNI is blocked), widen back to .githubcopilot.com
# and re-validate. The validation step below will catch any over-tightening.
# NOTE: do NOT also list api.individual.githubcopilot.com or telemetry.individual.githubcopilot.com
# separately - Squid will FATAL on the redundant entries when a leading-dot wildcard is present.
acl allowed_SNI ssl::server_name .individual.githubcopilot.com

