# src/gateway/squid.conf
# DISCOVERY-ONLY CONFIG (OI-08-C empirical allowlist discovery). NOT a production config.
# Mode: peek the SNI for logging, then SPLICE ALL (block nothing). Used only via
# docker-compose.discovery.yml to observe every host a real workflow hits.
# The production squid.conf (deny-by-default, terminate-all) is the real boundary.
# Reference: ADR-002 D2, D3, D4, D5.
#
# MECHANISM (ADR-002 D3: SNI-splice as the default):
#
#   The proxy operates in explicit-proxy mode (http_port, no transparent intercept).
#   The devcontainer sets HTTP_PROXY/HTTPS_PROXY to http://localhost:8080.
#   HTTPS traffic arrives as HTTP CONNECT tunnels on port 8080.
#
#   For each CONNECT request, Squid uses SslPeekAndSplice:
#     1. ssl_bump peek all:       read the TLS ClientHello to obtain the real SNI
#     2. ssl_bump splice ...:     if the PEEKED SNI is on the allowlist, become a
#                                 transparent TCP tunnel (no decryption, no CA needed,
#                                 client sees only the real server cert)
#     3. ssl_bump terminate all:  if the PEEKED SNI is NOT on the allowlist, send a
#                                 TCP RST to the client and log the blocked SNI
#
#   The allowlist check is on the PEEKED TLS SNI (ssl::server_name ACL),
#   NOT on the client-supplied CONNECT host. This closes the domain-fronting /
#   SNI-mismatch bypass: a client that sends CONNECT api.github.com:443 but
#   presents SNI evil.com in the ClientHello will have its connection terminated,
#   because Squid peeks the real SNI and evil.com is not on the allowlist.
#
# NO CA CERT / NO DECRYPTION:
#   splice does not decrypt traffic. Squid becomes a transparent TCP tunnel for
#   allowed connections. No custom CA is distributed to clients. No cert pinning
#   is broken.
#
#   The 'Requiring client certificates' message Squid emits during init is
#   informational and does not indicate CA distribution. It refers to Squid's
#   ability to request a client cert from connecting clients (which we do not
#   use). It does not mean we issue or distribute any certificate.
#
# Build-time discoveries (all empirically verified 2026-06-14, Squid 5.9):
#
#  1. squid vs squid-openssl: On Ubuntu 22.04, install squid-openssl only
#     (squid and squid-openssl conflict). squid-openssl is required for ssl_bump.
#
#  2. at_step SslBump1 is required for correct peek->splice/terminate behavior:
#     Use 'acl step1 at_step SslBump1' and 'ssl_bump peek step1'. Without the
#     at_step restriction, 'ssl_bump peek all' matches at step 2 as well, and
#     the splice/terminate rules may not fire correctly. Empirically: without
#     at_step, example.com was spliced (allowed) instead of terminated (blocked).
#     The at_step ACL restricts peek to step 1; at step 2 (SNI available), Squid
#     re-evaluates and correctly fires splice (for allowed SNI) or terminate (all).
#
#  3. cert= and generate-host-certificates=on are required even in splice-only mode:
#     See the proxy listener section below for the full RC-3 empirical finding.
#     Short version: without cert=, Squid crashes; with generate-host-certificates=off,
#     the TLS peek context is null (OpenSSL error:0A0000C3) and peek fails.
#     generate-host-certificates=on is required, but no certs are generated in
#     practice since only splice/terminate actions are taken (no bump).
#
#  4. sslcrtd_program and ssl_db initialization are required:
#     Squid starts security_file_certgen helpers at init even in splice-only mode.
#     Without an initialized ssl_db, helpers crash and Squid aborts.
#
#  5. ssl::server_name redundancy: Same rule as dstdomain applies: if you list
#     .example.com (all subdomains), do NOT also list sub.example.com (specific
#     subdomain). Squid will FATAL on the redundant specific-subdomain entry.
#     Use leading-dot wildcard OR specific entries, not both.
#
#  6. cache_dir null not supported: 'cache deny all' is sufficient.
#
#  7. http_access and ssl_bump ordering: http_access rules are evaluated at
#     CONNECT time (before the ClientHello is read). ssl::server_name ACL values
#     are only available after peeking. Therefore http_access must allow all
#     CONNECT from localnet (so Squid can read the ClientHello), and the
#     ssl_bump rules enforce the domain policy on the peeked SNI.

# ---- Proxy listener ----
# Explicit HTTP proxy with ssl-bump enabled.
#
# EMPIRICAL FINDING (Squid 5.9, 2026-06-14, RC-3):
#   Three things are required for Squid 5.9 to start in peek+splice mode:
#
#   1. cert= (and key=): Required for the ssl-bump port TLS context. Without it,
#      Squid crashes immediately at startup.
#
#   2. generate-host-certificates=on: Required so Squid initializes the TLS peek
#      context correctly. With generate-host-certificates=off, peek fails with
#      "null ssl ctx" error because the per-connection TLS handle cannot be
#      allocated (OpenSSL error:0A0000C3:SSL routines::null ssl ctx).
#
#   3. sslcrtd_program with ssl_db initialized: Required because Squid starts
#      security_file_certgen helpers even in splice-only mode. Without a valid
#      ssl_db, helpers crash and Squid aborts ("helpers are crashing too rapidly").
#
# NO DECRYPTION OCCURS despite generate-host-certificates=on:
#   Certificate generation (the MITM path) is triggered only by the ssl_bump bump
#   action. Our config uses only splice (pass-through) and terminate (TCP RST).
#   No per-host certs are generated, the ssl_db stays empty, and clients are NEVER
#   presented with Squid-generated certs. Spliced connections show only the real
#   upstream server cert.
#
# The squid-splice.crt is NOT a CA cert, is NOT distributed to clients, is NOT
# the MITM opt-in (ADR-002 D3). See Dockerfile for the full RC-3 documentation.
http_port 8080 ssl-bump \
    cert=/etc/squid/ssl/squid-splice.crt \
    key=/etc/squid/ssl/squid-splice.key \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB

# sslcrtd_program: the cert generation helper.
# Required by Squid even in splice-only mode (started at Squid init).
# The ssl_db directory is initialized at image build time (Dockerfile).
# No certs will be generated in practice (only splice/terminate, not bump).
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB

# ---- ACL definitions ----

# CONNECT method (used for HTTPS tunneling via HTTP proxy)
acl CONNECT method CONNECT

# NOTE: No allowlist included here. Discovery mode splices ALL connections (ssl_bump splice all
# below). The allowed_SNI / allowed_registry_SNI ACLs from the production allowlist are not
# used in this config. The allowlist is only needed for the production deny-by-default config.
# squid-allowlist.conf was previously included here but is unused in splice-all mode.
# The file lives at src/gateway/discovery/squid-allowlist.conf for reference only.

# Source networks allowed to use the proxy (Docker bridge ranges + loopback).
acl localnet src 127.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 10.0.0.0/8
acl localnet src 192.168.0.0/16

# Only permit HTTPS port 443 for CONNECT tunnels (no arbitrary port tunneling).
acl SSL_ports port 443

# ---- SslPeekAndSplice rules ----
# Evaluated after http_access allows the initial CONNECT.
# These rules observe the real TLS SNI (not the CONNECT host).
#
# STEP MODEL (Squid SslPeekAndSplice):
#   Step 1: CONNECT received. No TLS data yet. peek here to trigger ClientHello read.
#   Step 2: ClientHello parsed; ssl::server_name (SNI) is now available.
#   Step 3: Server Hello available (only reached if no step-2 decision).
#
# CRITICAL: Use 'acl step1 at_step SslBump1' to restrict peek to step 1 only.
#   Without at_step, 'ssl_bump peek all' matches at EVERY step, and Squid
#   may re-evaluate peek at step 2 before splice/terminate get a chance to
#   fire. The at_step constraint ensures that at step 2, the peek rule no
#   longer matches, so Squid evaluates splice (allowed SNI) or terminate (all)
#   with the SNI information already available.
#
# Canonical form from SslPeekAndSplice wiki (verified 2026-06-14):
#   acl step1 at_step SslBump1
#   ssl_bump peek step1
#   ssl_bump splice allowedSites
#   ssl_bump terminate all

# Restrict the peek action to step 1 only (before ClientHello is parsed).
acl step1 at_step SslBump1

# Step 1 (only): Peek the TLS ClientHello to read the real SNI.
ssl_bump peek step1

# Step 2 (after SNI is available): Splice if SNI is on the allowlist.
# Splice = transparent TCP tunnel, no decryption, client sees real server cert.
# (discovery: splice all below)

# Step 2 (after SNI is available): Terminate any connection whose peeked SNI
# is NOT on the allowlist. TCP RST is sent. No certificate is generated or sent.
# This closes the domain-fronting / SNI-mismatch bypass:
#   CONNECT api.github.com + TLS SNI evil.com -> DENIED here.
ssl_bump splice all

# ---- HTTP access control ----
# Evaluated top-to-bottom; first match wins.

# Deny CONNECT to non-443 ports (prevent port-forwarding abuse).
http_access deny CONNECT !SSL_ports

# Allow CONNECT from local networks.
# NOTE: at CONNECT time the TLS ClientHello has NOT been read yet, so
# ssl::server_name ACL values are unavailable here. The SNI-based policy
# is enforced by the ssl_bump rules above (peek -> splice/terminate).
# We allow all localnet CONNECT so Squid can peek every ClientHello.
http_access allow localnet CONNECT

# Deny all other CONNECT (non-local source).
http_access deny CONNECT

# DISCOVERY MODE: allow all localnet (CONNECT already allowed above; this adds plain HTTP
# for apt/tooling install). Every SNI is still peeked and logged. Harvest is filtered.
http_access allow localnet
http_access deny all

# ---- Access log format ----
# %ssl::>sni: the TLS SNI from the peeked ClientHello.
# With peek+splice, this field is populated for all HTTPS connections
# (Squid reads the ClientHello SNI before splicing). This is the
# primary audit field for the L7 allowlist decision.
# Fields: timestamp elapsed client result/status bytes method URL user hierarchy/peer MIME sni
logformat copilot_combined %ts %tr %>a %Ss/%>Hs %<st %rm %ru %[un %Sh/%<a %mt %ssl::>sni

access_log /var/log/squid/access.log copilot_combined
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid.pid

# ---- Caching disabled ----
# No disk caching (preserves audit trail; every request hits the log).
cache deny all

# ---- Process privileges ----
cache_effective_user proxy
cache_effective_group proxy

# ---- Security headers ----
httpd_suppress_version_string on
forwarded_for delete

# ---- DNS: Docker Desktop host resolver ----
# RUNTIME FINDING 2026-06-14: Docker Desktop (macOS) custom bridge network
# embedded DNS (127.0.0.11) is broken due to conntrack DNAT/SNAT not functioning
# inside containers. Using the Docker Desktop host resolver (192.168.65.7) instead.
# This address is internal to Docker Desktop's LinuxKit VM, not a public internet
# DNS server. The init-firewall.sh L3 rule allows UDP/53 to this address only.
#
# Default is the Docker Desktop resolver; the entrypoint rewrites this from
# GATEWAY_DNS_RESOLVER at startup (127.0.0.11 on native Linux).
dns_nameservers 192.168.65.7
# Prefer IPv4 (Docker bridge is IPv4-only on both platforms; avoids IPv6 timeouts).
dns_v4_first on

# ---- Timeouts ----
connect_timeout 30 seconds
read_timeout 60 seconds
shutdown_lifetime 5 seconds
