title = "AgentArca gitleaks config"

# Start from gitleaks' built-in ruleset, then allowlist the project's
# INTENTIONAL decoys and config keywords that are not real secrets.
[extend]
useDefault = true

[allowlist]
description = "Intentional honeytokens and config directives (not real secrets)"
# match the regexes below against the whole line, not just the captured secret
regexTarget = "line"
paths = [
  # The detection arm deliberately plants fake secret-looking canary tokens to
  # catch exfiltration. Every "secret" in this file is a decoy by design.
  '''src/detect/canary-placement\.sh''',
]
regexes = [
  # rsyslog TLS auth-mode directive (e.g. StreamDriverAuthMode="x509/name"),
  # a config keyword, not an API key.
  '''StreamDriverAuthMode''',
  # AC-27-P1-17 test canary: a designed decoy constant used to verify that the
  # admin secret sanitization code strips the value from audit records before
  # they are written. This is not a real secret; it is the target of the test.
  # File: tests/admin/test_allowlist_api.py, class TestSecretSanitization.
  '''SECRET_CANARY\s*=\s*"TEST-SECRET-CANARY-12345"''',
  # Phase 1 red-team canary: the adversarial sanitization suite submits this
  # value AS a host to prove the secret never lands in the audit trail or a
  # response body (Finding 1 + Finding 2, both fixed). Not a real secret.
  # File: tests/admin/test_redteam_phase1.py, class TestAuditTamperAndSecretExfil.
  '''SECRET_CANARY\s*=\s*"RT-PHASE1-SECRET-CANARY-9f8e7d"''',
  # Phase 2 red-team canary: the adversarial suite (221 attack cases, 7 classes)
  # submits this as a profile path param and via switch body fields to prove the
  # value is never echoed in a response body or persisted to the audit log.
  # Not a real secret. File: tests/admin/test_redteam_phase2.py,
  # class TestAuditTamperAndSecretExfil.
  '''SECRET_CANARY\s*=\s*"RT-PHASE2-SECRET-CANARY-7a6b5c"''',
  # Phase 2 red-team test fixture secret: a hardcoded dummy value used only in
  # the Docker-free test harness (TestClient against a temp secret file); never
  # a real credential. File: tests/admin/test_redteam_phase2.py, TEST_SECRET.
  '''TEST_SECRET\s*=\s*"test-secret-value-12345"''',
]
