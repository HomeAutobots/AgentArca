# config/allowlist.local.d/00-local.conf
#
# Placeholder for the developer-local egress allowlist overlay. Comment-only =
# functionally a no-op (it adds no hosts), but it MUST exist: Squid's
# `include /etc/squid/local.d/*.conf` FATALs if the glob matches zero files, and the
# read-only bind mount of this directory shadows the image's baked copy — so the
# guaranteed match has to live here, committed.
#
# DO NOT add hosts here. Your machine-local additions go in `overrides.conf` (gitignored),
# managed by `src/scripts/allowlist-local.sh add <host>`. See overrides.conf.example.
