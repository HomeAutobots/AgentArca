# tests/acceptance/fixtures/empty-local.d/00-local.conf
#
# Test mask for the developer-local allowlist overlay. Comment-only (adds no hosts).
#
# The production gateway bind-mounts ./config/allowlist.local.d (a developer's machine-local
# egress additions) read-only at /etc/squid/local.d. The acceptance/containment test overrides
# mount THIS directory over that same path instead, so the security/containment suites always
# run against the baked allowlist only — a developer's local overrides can never mask a
# boundary-failure in a test run. Required because Squid FATALs if the include glob is empty.
