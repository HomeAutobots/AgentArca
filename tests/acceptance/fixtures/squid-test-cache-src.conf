# tests/acceptance/fixtures/squid-test-cache-src.conf
#
# Squid conf.d snippet for the item-15 acceptance test environment.
# Included from squid.conf via 'include /etc/squid/conf.d/*.conf'.
# Production: /etc/squid/conf.d/ is empty -> no-op.
# Test (acc15): mounted via compose override.
#
# Purpose: extend the cache_src ACL to include the test-environment cache-net
# subnet (10.15.1.0/24). In Squid, multiple 'acl' lines with the same name are
# ORed. The production cache_src (172.30.0.0/24) plus this entry = cache_src
# matches Verdaccio/devpi from either the production or test subnets.
#
# Without this: Verdaccio/devpi on 10.15.1.x would not match cache_src, so their
# upstream requests to registry SNIs would be terminated by ssl_bump terminate all.
# With this: their requests get ssl_bump splice allowed_registry_SNI -> tunneled.
acl cache_src src 10.15.1.0/24
