# tests/containment/compose.rt25-codex-override.yml
#
# Compose override for the item-25 CODEX profile CONTAINMENT red-team stack (rt25).
# Applied with: docker compose -p rt25-codex -f docker-compose.yml \
#               -f tests/containment/compose.rt25-codex-override.yml --profile codex ...
#
# FRAME: "ASSUME PROMPT INJECTION SUCCEEDS; prove the boundary HOLDS."
# Codex-specific: its app-level HTTPS_PROXY honoring is incomplete by design (R-l). The
# point of the codex run is to prove the L3 firewall contains egress REGARDLESS of whether
# the app honors the proxy, and even if the Codex interior sandbox is assumed defeated.
#
# Distinct project name (rt25-codex) + distinct subnets:
#   rt25-codex_copilot-net: 10.46.0.0/24
#   rt25-codex_cache-net:   10.46.1.0/24
# Pre-created external by rt25-run-profiles.sh.
#
# NOTE (FIX-F2 2026-06-20): The single 'gateway' service was replaced by per-profile
# services. This override targets gateway-codex. SQUID_AGENT_FRAGMENT=codex.conf is
# HARDCODED in the base compose service (no host-shell export needed).

services:
  gateway-codex:
    container_name: ""
    mem_limit: 2g
    volumes:
      - type: bind
        source: ./tests/acceptance/fixtures/squid-test-cache-src.conf
        target: /etc/squid/conf.d/squid-test-cache-src.conf
        read_only: true

  devcontainer-codex:
    container_name: ""
    mem_limit: 2g

  verdaccio:
    container_name: ""
    mem_limit: 512m

  devpi:
    container_name: ""
    mem_limit: 512m

networks:
  copilot-net:
    name: rt25-codex_copilot-net
    external: true
  cache-net:
    name: rt25-codex_cache-net
    external: true
