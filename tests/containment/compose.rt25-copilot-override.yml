# tests/containment/compose.rt25-copilot-override.yml
#
# Compose override for the item-25 COPILOT profile CONTAINMENT re-confirmation stack (rt25).
# Applied with: docker compose -p rt25-copilot -f docker-compose.yml \
#               -f tests/containment/compose.rt25-copilot-override.yml --profile copilot ...
#
# FRAME: "ASSUME PROMPT INJECTION SUCCEEDS; prove the Copilot baseline is UNCHANGED."
# This re-runs the SAME profile-parameterized containment attacks against the copilot
# profile so we can confirm Copilot stays at its 0/N attack-success baseline under the
# multi-agent refactor.
#
# Distinct project name (rt25-copilot) + distinct subnets:
#   rt25-copilot_agent-net: 10.47.0.0/24
#   rt25-copilot_cache-net:   10.47.1.0/24
# Pre-created external by rt25-run-profiles.sh.
#
# NOTE (FIX-F2 2026-06-20): The single 'gateway' service was replaced by per-profile
# services. This override targets gateway-copilot. SQUID_AGENT_FRAGMENT=copilot.conf is
# HARDCODED in the base compose service (no host-shell export needed).

services:
  gateway-copilot:
    container_name: !reset null
    mem_limit: 2g
    volumes:
      - type: bind
        source: ./tests/acceptance/fixtures/squid-test-cache-src.conf
        target: /etc/squid/conf.d/squid-test-cache-src.conf
        read_only: true

  devcontainer:
    container_name: !reset null
    mem_limit: 2g

  verdaccio:
    container_name: !reset null
    mem_limit: 512m

  devpi:
    container_name: !reset null
    mem_limit: 512m

networks:
  agent-net:
    name: rt25-copilot_agent-net
    external: true
  cache-net:
    name: rt25-copilot_cache-net
    external: true
